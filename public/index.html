<!DOCTYPE html>
<html lang="en" style="background:#09090b;">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg?v=3" type="image/svg+xml" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.svg?v=3" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Theme — #09090b makes browser chrome dark on mobile -->
    <meta name="theme-color" content="#09090b" />
    <meta name="background-color" content="#09090b" />
    <meta name="msapplication-TileColor" content="#09090b" />

    <!-- App description -->
    <meta name="description" content="The exclusive student marketplace for BMSIT. Buy and sell within campus. Verified @bmsit.in emails only." />
    <meta name="keywords" content="BMSIT, marketplace, campus, students, buy, sell, bazaar" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BMSIT Bazaar" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.svg?v=3" />

    <!-- Android PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="BMSIT Bazaar" />

    <!-- Open Graph (for sharing links) -->
    <meta property="og:title" content="BMSIT Bazaar" />
    <meta property="og:description" content="The exclusive student marketplace for BMSIT campus." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%PUBLIC_URL%/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <title>BMSIT Bazaar</title>
    <style>
      /* Prevent white flash before React loads */
      html, body, #root {
        background: #09090b !important;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body style="background:#09090b; margin:0; padding:0;">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
