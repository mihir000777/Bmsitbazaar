<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>BMSIT Bazaar - Join the Circle</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&amp;family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#0e0e10",
                        "on-error": "#690005",
                        "on-tertiary-fixed-variant": "#004e59",
                        "surface-container-high": "#2a2a2c",
                        "border-low-light": "rgba(255, 255, 255, 0.05)",
                        "secondary": "#4edea3",
                        "background": "#131315",
                        "primary": "#ffecb9",
                        "outline": "#9a9078",
                        "on-tertiary": "#00363e",
                        "surface-container-highest": "#353437",
                        "surface-container": "#201f22",
                        "surface-container-low": "#1c1b1d",
                        "surface-dim": "#131315",
                        "inverse-surface": "#e5e1e4",
                        "on-secondary-container": "#00311f",
                        "on-tertiary-container": "#006270",
                        "on-primary-fixed": "#231b00",
                        "on-secondary-fixed": "#002113",
                        "inverse-primary": "#735c00",
                        "surface-tint": "#eec200",
                        "on-secondary-fixed-variant": "#005236",
                        "surface-bright": "#39393b",
                        "tertiary-fixed": "#a0efff",
                        "tertiary": "#c7f5ff",
                        "outline-variant": "#4d4632",
                        "on-primary-container": "#6c5700",
                        "on-primary": "#3c2f00",
                        "background-accent": "#1e1b4b",
                        "surface-variant": "#353437",
                        "primary-container": "#facc15",
                        "surface-base": "#18181b",
                        "secondary-container": "#00a572",
                        "secondary-fixed": "#6ffbbe",
                        "secondary-fixed-dim": "#4edea3",
                        "neon-yellow-glow": "rgba(250, 204, 21, 0.4)",
                        "on-background": "#e5e1e4",
                        "on-error-container": "#ffdad6",
                        "on-surface-variant": "#d1c6ab",
                        "on-surface": "#e5e1e4",
                        "inverse-on-surface": "#313032",
                        "tertiary-container": "#33e4ff",
                        "error-container": "#93000a",
                        "primary-fixed": "#ffe083",
                        "tertiary-fixed-dim": "#15daf4",
                        "surface": "#131315",
                        "on-primary-fixed-variant": "#574500",
                        "primary-fixed-dim": "#eec200",
                        "on-tertiary-fixed": "#001f25",
                        "on-secondary": "#003824",
                        "error": "#ffb4ab"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "container-max": "1280px",
                        "gutter": "24px",
                        "margin-desktop": "40px",
                        "base": "8px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "label-sm": ["Outfit"],
                        "label-md": ["Outfit"],
                        "display-lg": ["Syne"],
                        "body-md": ["Outfit"],
                        "headline-lg": ["Syne"],
                        "body-lg": ["Outfit"],
                        "headline-md": ["Syne"],
                        "headline-lg-mobile": ["Syne"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", {"lineHeight": "1", "fontWeight": "500"}],
                        "label-md": ["14px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                        "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "1.2", "fontWeight": "700"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "1.2", "fontWeight": "700"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glow-button:hover {
            box-shadow: 0px 0px 20px rgba(250, 204, 21, 0.3);
        }
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.15;
        }
        .orb-1 { width: 400px; height: 400px; background: #facc15; top: -100px; right: -100px; }
        .orb-2 { width: 500px; height: 500px; background: #4edea3; bottom: -150px; left: -150px; }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen selection:bg-primary-container selection:text-on-primary-container">
<!-- Background Orbs -->
<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>
<main class="relative z-10 flex flex-col items-center justify-center min-h-screen px-margin-mobile md:px-margin-desktop py-12">
<!-- Header Branding (Shell Visibility Rule: Suppressed, so we manually render a simplified logo/back button if needed, but per prompt we focus on Sign Up Screen) -->
<a class="mb-12 group transition-transform duration-300 active:scale-95" href="{{DATA:SCREEN:SCREEN_20}}">
<h1 class="text-headline-md font-syne font-bold text-primary italic tracking-tighter">BMSIT Bazaar</h1>
</a>
<!-- Sign Up Bento/Glass Card -->
<div class="glass-panel w-full max-w-[500px] rounded-xl p-8 md:p-12 shadow-2xl relative overflow-hidden">
<!-- Decorative accent line -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary-container to-transparent opacity-50"></div>
<div class="text-center mb-10">
<h2 class="font-syne text-headline-lg text-on-surface mb-2">Create Account</h2>
<p class="font-outfit text-body-md text-on-surface-variant">Join the exclusive community of BMSIT students.</p>
</div>
<form action="{{DATA:SCREEN:SCREEN_18}}" class="space-y-6" method="POST">
<!-- Full Name -->
<div class="space-y-2">
<label class="font-outfit text-label-md text-on-surface ml-1">Full Name</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">person</span>
<input class="w-full bg-surface-container-lowest border border-border-low-light rounded-lg py-4 pl-12 pr-4 focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container text-on-surface transition-all" placeholder="John Doe" required="" type="text">
</div>
</div>
<!-- Campus Email -->
<div class="space-y-2">
<label class="font-outfit text-label-md text-on-surface ml-1">Campus Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full bg-surface-container-lowest border border-border-low-light rounded-lg py-4 pl-12 pr-4 focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container text-on-surface transition-all" pattern=".+@bmsit\.in" placeholder="name@bmsit.in" required="" type="email">
</div>
</div>
<!-- USN -->
<div class="space-y-2">
<label class="font-outfit text-label-md text-on-surface ml-1">USN (University Seat Number)</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">badge</span>
<input class="w-full bg-surface-container-lowest border border-border-low-light rounded-lg py-4 pl-12 pr-4 focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container text-on-surface transition-all uppercase" placeholder="1BY20XX000" required="" type="text">
</div>
</div>
<!-- Password -->
<div class="space-y-2">
<label class="font-outfit text-label-md text-on-surface ml-1">Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full bg-surface-container-lowest border border-border-low-light rounded-lg py-4 pl-12 pr-4 focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container text-on-surface transition-all" placeholder="••••••••" required="" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Verification Info Box -->
<div class="flex items-start gap-3 p-4 bg-primary/5 border border-primary/10 rounded-lg">
<span class="material-symbols-outlined text-primary-container text-[20px] mt-0.5" data-weight="fill">info</span>
<p class="font-outfit text-label-sm text-on-surface-variant leading-relaxed">
                        A verification link will be sent to your campus email address. Please check your inbox (and spam folder) after signing up.
                    </p>
</div>
<!-- CTA Button -->
<button class="glow-button w-full bg-primary-container text-on-primary font-syne font-bold text-body-md py-4 rounded-lg transition-all duration-300 active:scale-[0.98] hover:brightness-110" type="submit">
                    Create Account
                </button>
</form>
<div class="mt-8 pt-8 border-t border-border-low-light text-center">
<p class="font-outfit text-body-md text-on-surface-variant">
                    Already have an account? 
                    <a class="text-primary font-semibold hover:underline decoration-primary/50 underline-offset-4 transition-all" href="login.html">Log In</a>
</p>
</div>
</div>
<!-- Decorative Campus Element -->
<div class="mt-12 flex items-center gap-4 text-on-surface-variant opacity-40">
<span class="h-[1px] w-12 bg-on-surface-variant"></span>
<span class="font-syne text-label-sm tracking-widest uppercase">Verified Student Network</span>
<span class="h-[1px] w-12 bg-on-surface-variant"></span>
</div>
</main>
<!-- Micro-interaction Scripts -->
<script>
        // Password Visibility Toggle
        const toggleBtn = document.querySelector('button[type="button"]');
        const passInput = document.querySelector('input[type="password"]');
        const icon = toggleBtn.querySelector('.material-symbols-outlined');

        toggleBtn.addEventListener('click', () => {
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passInput.type = 'password';
                icon.textContent = 'visibility';
            }
        });

        // Form Submit Simulation for Demo
        document.querySelector('form').addEventListener('submit', (e) => {
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            // In a real app, redirection happens via form action
        });
    </script>
</body></html>
