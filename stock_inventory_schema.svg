<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="Arial, sans-serif" font-size="12">
  <rect width="860" height="560" fill="white"/>

  <!-- TITLE -->
  <text x="20" y="25" font-size="15" font-weight="bold" fill="black">Schema Diagram — Stock Inventory Management System</text>

  <!-- ══════════════════════════════════════════════════════
       TABLE ROWS  (all start at x=20, stacked vertically)
       Each row height = 26px, gap between tables = 30px
       
       y positions:
         SUPPLIER  : label=50,  row=56
         PRODUCT   : label=110, row=116
         PURCHASE  : label=170, row=176
         SALES     : label=230, row=236
         EMPLOYEE  : label=290, row=296
         CUSTOMER  : label=350, row=356
  ══════════════════════════════════════════════════════ -->

  <!-- ── SUPPLIER ── -->
  <text x="20" y="50" font-weight="bold" font-size="12">SUPPLIER</text>
  <g transform="translate(20,56)">
    <rect width="100" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="50" y="18" text-anchor="middle" font-size="11" text-decoration="underline">Supplier_ID</text>
    <rect x="100" width="80" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="140" y="18" text-anchor="middle" font-size="11">Name</text>
    <rect x="180" width="90" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="225" y="18" text-anchor="middle" font-size="11">Phone_no</text>
    <rect x="270" width="100" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="320" y="18" text-anchor="middle" font-size="11">Address</text>
    <rect x="370" width="80" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="410" y="18" text-anchor="middle" font-size="11">Email</text>
    <rect x="450" width="60" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="480" y="18" text-anchor="middle" font-size="11">City</text>
  </g>

  <!-- ── PRODUCT ── -->
  <text x="20" y="110" font-weight="bold" font-size="12">PRODUCT</text>
  <g transform="translate(20,116)">
    <rect width="100" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="50" y="18" text-anchor="middle" font-size="11" text-decoration="underline">Product_ID</text>
    <rect x="100" width="80" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="140" y="18" text-anchor="middle" font-size="11">Name</text>
    <rect x="180" width="90" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="225" y="18" text-anchor="middle" font-size="11">Category</text>
    <rect x="270" width="80" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="310" y="18" text-anchor="middle" font-size="11">Price</text>
    <rect x="350" width="80" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="390" y="18" text-anchor="middle" font-size="11">Quantity</text>
    <rect x="430" width="120" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="490" y="18" text-anchor="middle" font-size="11">Supplier_ID (FK)</text>
  </g>

  <!-- ── PURCHASE ── -->
  <text x="20" y="170" font-weight="bold" font-size="12">PURCHASE</text>
  <g transform="translate(20,176)">
    <rect width="110" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="55" y="18" text-anchor="middle" font-size="11" text-decoration="underline">Purchase_ID</text>
    <rect x="110" width="110" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="165" y="18" text-anchor="middle" font-size="11">Product_ID (FK)</text>
    <rect x="220" width="120" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="280" y="18" text-anchor="middle" font-size="11">Supplier_ID (FK)</text>
    <rect x="340" width="90" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="385" y="18" text-anchor="middle" font-size="11">Quantity</text>
    <rect x="430" width="110" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="485" y="18" text-anchor="middle" font-size="11">Purchase_Date</text>
    <rect x="540" width="120" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="600" y="18" text-anchor="middle" font-size="11">Employee_ID (FK)</text>
  </g>

  <!-- ── SALES ── -->
  <text x="20" y="230" font-weight="bold" font-size="12">SALES</text>
  <g transform="translate(20,236)">
    <rect width="90" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="45" y="18" text-anchor="middle" font-size="11" text-decoration="underline">Sales_ID</text>
    <rect x="90" width="110" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="145" y="18" text-anchor="middle" font-size="11">Product_ID (FK)</text>
    <rect x="200" width="90" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="245" y="18" text-anchor="middle" font-size="11">Qty_Sold</text>
    <rect x="290" width="100" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="340" y="18" text-anchor="middle" font-size="11">Sales_Date</text>
    <rect x="390" width="120" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="450" y="18" text-anchor="middle" font-size="11">Employee_ID (FK)</text>
    <rect x="510" width="120" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="570" y="18" text-anchor="middle" font-size="11">Customer_ID (FK)</text>
  </g>

  <!-- ── EMPLOYEE ── -->
  <text x="20" y="290" font-weight="bold" font-size="12">EMPLOYEE</text>
  <g transform="translate(20,296)">
    <rect width="110" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="55" y="18" text-anchor="middle" font-size="11" text-decoration="underline">Employee_ID</text>
    <rect x="110" width="80" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="150" y="18" text-anchor="middle" font-size="11">Name</text>
    <rect x="190" width="80" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="230" y="18" text-anchor="middle" font-size="11">Email</text>
    <rect x="270" width="90" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="315" y="18" text-anchor="middle" font-size="11">Phone</text>
    <rect x="360" width="100" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="410" y="18" text-anchor="middle" font-size="11">Department</text>
  </g>

  <!-- ── CUSTOMER ── -->
  <text x="20" y="350" font-weight="bold" font-size="12">CUSTOMER</text>
  <g transform="translate(20,356)">
    <rect width="110" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="55" y="18" text-anchor="middle" font-size="11" text-decoration="underline">Customer_ID</text>
    <rect x="110" width="80" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="150" y="18" text-anchor="middle" font-size="11">Name</text>
    <rect x="190" width="80" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="230" y="18" text-anchor="middle" font-size="11">Phone</text>
    <rect x="270" width="80" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="310" y="18" text-anchor="middle" font-size="11">Email</text>
    <rect x="350" width="100" height="26" fill="#ddd0ee" stroke="black" stroke-width="1"/>
    <text x="400" y="18" text-anchor="middle" font-size="11">Address</text>
  </g>

  <!-- ══════════════════════════════════════════════════════
       CONNECTION LINES
       
       Strategy: All lines exit from the RIGHT end of the FK cell,
       travel right to a dedicated vertical lane, travel up/down
       in that lane, then enter the PK cell from the RIGHT end.
       
       Table right edges (x = 20 + last_cell_right):
         SUPPLIER  right = 20+510 = 530
         PRODUCT   right = 20+550 = 570
         PURCHASE  right = 20+660 = 680
         SALES     right = 20+630 = 650
         EMPLOYEE  right = 20+460 = 480
         CUSTOMER  right = 20+450 = 470
       
       Vertical lanes (all to the right of widest table = 680):
         Lane A = 700  (PRODUCT.Supplier_ID → SUPPLIER)
         Lane B = 720  (PURCHASE.Supplier_ID → SUPPLIER)
         Lane C = 740  (PURCHASE.Employee_ID → EMPLOYEE)
         Lane D = 760  (SALES.Employee_ID → EMPLOYEE)
         Lane E = 780  (SALES.Customer_ID → CUSTOMER)
       
       Left-side lanes for upward FK refs within same column:
         Lane L1 = 5   (PURCHASE.Product_ID → PRODUCT)
         Lane L2 = 5   (SALES.Product_ID → PRODUCT) — same lane, diff y
       
       Arrow = small filled triangle pointing toward destination
  ══════════════════════════════════════════════════════ -->

  <!-- ─────────────────────────────────────────────────────
       LINE 1: PRODUCT.Supplier_ID(FK) → SUPPLIER.Supplier_ID
       FK cell right: 20+430+120 = 570, mid-y: 116+13 = 129
       SUPPLIER PK right: 20+100 = 120, mid-y: 56+13 = 69
       Lane A = 700
       Path: (570,129) → (700,129) → (700,69) → (120,69)
       Arrow at (120,69) pointing left →
  ───────────────────────────────────────────────────── -->
  <polyline points="570,129 700,129 700,69 122,69" fill="none" stroke="black" stroke-width="1"/>
  <polygon points="122,69 132,64 132,74" fill="black"/>

  <!-- ─────────────────────────────────────────────────────
       LINE 2: PURCHASE.Product_ID(FK) → PRODUCT.Product_ID
       FK cell: x=20+110=130 to 220, mid-y: 176+13=189
       PRODUCT PK right: 120, mid-y: 116+13=129
       Use left lane L1 = 5
       Path: (130,189) → (5,189) → (5,129) → (20,129)
       Arrow at (20,129) pointing right →
  ───────────────────────────────────────────────────── -->
  <polyline points="130,189 5,189 5,129 18,129" fill="none" stroke="black" stroke-width="1"/>
  <polygon points="18,129 8,124 8,134" fill="black"/>

  <!-- ─────────────────────────────────────────────────────
       LINE 3: PURCHASE.Supplier_ID(FK) → SUPPLIER.Supplier_ID
       FK cell: x=20+220=240 to 340, mid-y: 176+13=189
       SUPPLIER PK right: 120, mid-y: 56+13=69
       Lane B = 720
       Path: (340,189) → (720,189) → (720,69) → (122,69)
       Arrow at (122,69) — same target as Line 1, offset slightly
       Use y=74 to avoid overlap with Line 1 arrow
  ───────────────────────────────────────────────────── -->
  <polyline points="340,189 720,189 720,74 122,74" fill="none" stroke="black" stroke-width="1"/>
  <polygon points="122,74 132,69 132,79" fill="black"/>

  <!-- ─────────────────────────────────────────────────────
       LINE 4: PURCHASE.Employee_ID(FK) → EMPLOYEE.Employee_ID
       FK cell: x=20+540=560 to 660, mid-y: 176+13=189
       EMPLOYEE PK right: 20+110=130, mid-y: 296+13=309
       Lane C = 740
       Path: (660,189) → (740,189) → (740,309) → (132,309)
       Arrow at (132,309) pointing left
  ───────────────────────────────────────────────────── -->
  <polyline points="660,189 740,189 740,309 132,309" fill="none" stroke="black" stroke-width="1"/>
  <polygon points="132,309 142,304 142,314" fill="black"/>

  <!-- ─────────────────────────────────────────────────────
       LINE 5: SALES.Product_ID(FK) → PRODUCT.Product_ID
       FK cell: x=20+90=110 to 200, mid-y: 236+13=249
       PRODUCT PK right: 120, mid-y: 129
       Use left lane L2 = 5 (same as L1 but different y segment)
       Path: (110,249) → (5,249) → (5,129) → (18,129)
       But L1 already uses x=5 between y=129 and y=189.
       So use x=5 for y=129→249 — they share the same vertical segment.
       Both arrows point to same cell — offset arrow to y=134
  ───────────────────────────────────────────────────── -->
  <polyline points="110,249 5,249 5,134 18,134" fill="none" stroke="black" stroke-width="1"/>
  <polygon points="18,134 8,129 8,139" fill="black"/>

  <!-- ─────────────────────────────────────────────────────
       LINE 6: SALES.Employee_ID(FK) → EMPLOYEE.Employee_ID
       FK cell: x=20+390=410 to 510, mid-y: 236+13=249
       EMPLOYEE PK right: 130, mid-y: 309
       Lane D = 760
       Path: (510,249) → (760,249) → (760,309) → (132,309)
       Offset arrow to y=314 to avoid Line 4 arrow
  ───────────────────────────────────────────────────── -->
  <polyline points="510,249 760,249 760,314 132,314" fill="none" stroke="black" stroke-width="1"/>
  <polygon points="132,314 142,309 142,319" fill="black"/>

  <!-- ─────────────────────────────────────────────────────
       LINE 7: SALES.Customer_ID(FK) → CUSTOMER.Customer_ID
       FK cell: x=20+510=530 to 630, mid-y: 236+13=249
       CUSTOMER PK right: 20+110=130, mid-y: 356+13=369
       Lane E = 780
       Path: (630,249) → (780,249) → (780,369) → (132,369)
       Arrow at (132,369) pointing left
  ───────────────────────────────────────────────────── -->
  <polyline points="630,249 780,249 780,369 132,369" fill="none" stroke="black" stroke-width="1"/>
  <polygon points="132,369 142,364 142,374" fill="black"/>

  <!-- ══════════════════════════════════════════════════════
       FOOTER
  ══════════════════════════════════════════════════════ -->
  <line x1="20" y1="415" x2="820" y2="415" stroke="#bbb" stroke-width="1"/>
  <text x="20" y="432" font-size="10" fill="#444">Submitted by: Dheeraj K (1BY24CB009)  ·  Dimple S Gowda (1BY24CB011)  ·  Mihir Govind (1BY24CB025)  ·  Tejas KS (1BY24CB060)</text>
  <text x="20" y="447" font-size="10" fill="#444">Under the guidance of Mr. Pradeep Kumar G M  ·  Dept. of CSBS, BMSIT&amp;M  ·  2026-2027</text>

</svg>
